[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nhs-ae-forecast"
version = "0.1.0"
description = "Probabilistic, hierarchical, revision-aware forecasts of NHS England A&E attendances and emergency admissions, with a winter bed-escalation decision layer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
xls = ["xlrd>=2.0", "openpyxl>=3.1"]
stats = ["statsmodels>=0.14"]
gbm = ["lightgbm>=4.0"]
models = ["lightgbm>=4.0", "statsmodels>=0.14", "pymc>=5.10", "arviz>=0.17", "nutpie>=0.13"]
app = ["streamlit>=1.30", "plotly>=5.18"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "ruff>=0.4", "statsmodels>=0.14", "lightgbm>=4.0", "matplotlib>=3.8"]

[project.scripts]
nhs-ae-ingest = "nhs_ae.ingest.cli:main"
nhs-ae-backtest = "nhs_ae.evaluate.cli:main"
nhs-ae-forecast = "nhs_ae.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
